<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به ASTRO</title>
    <style>
        body { 
            background-color: #050b14; 
            color: #fff; 
            font-family: Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        .login-container { 
            background: #0a101d; 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid #00f0ff; 
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1); 
            text-align: center; 
            width: 85%; 
            max-width: 380px; 
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: #0d1526;
            border-radius: 12px;
            padding: 5px;
            border: 1px solid #1a2a40;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #8892b0;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .tab.active {
            background: #0a2a33;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        h2 { 
            color: #00f0ff; 
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; 
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            background: #050b14; 
            border: 1px solid #1a2a40; 
            color: #fff; 
            border-radius: 12px; 
            text-align: right; 
            outline: none; 
            font-family: Tahoma;
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        input:focus { 
            border-color: #00f0ff; 
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); 
        }

        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(90deg, #00a8ff, #00f0ff); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0, 168, 255, 0.4);
        }
        
        .submit-btn:active { 
            transform: scale(0.98);
            box-shadow: 0 0 25px rgba(0, 168, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="tabs">
            <div class="tab">ساخت اکانت</div>
            <div class="tab active">ورود</div>
        </div>
        
        <h2>ASTRO</h2>
        <div class="subtitle">ورود به حساب کاربری</div>
        
        <!-- دکمه یک آیدی گرفتیم که بتونیم با جاوااسکریپت تغییرش بدیم -->
        <form onsubmit="return stealthLogin(event)">
            <input type="text" placeholder="نام کاربری (مثلاً Ali)" required>
            <input type="password" placeholder="رمز عبور (حداقل ۴ رقم)" required>
            <button type="submit" class="submit-btn" id="loginBtn">ورود</button>
        </form>
    </div>

    <script>
        function stealthLogin(event) {
            event.preventDefault(); // جلوگیری از ارسال واقعی
            
            var btn = document.getElementById('loginBtn');
            
            // ۱. تغییر ظاهر دکمه به حالت "در حال ورود" (شبیه سایت‌های واقعی)
            btn.innerText = "در حال ورود...";
            btn.style.opacity = "0.7";
            btn.disabled = true;
            
            // ۲. یه تاخیر ۱.۵ ثانیه‌ای میدیم تا حس کنه داره چک میشه
            setTimeout(function() {
                // ۳. انتقال کاربر به سایت اصلی خودت (تا فکر کنه وارد شده)
                window.location.href = "http://boz.ayarst.ir";
            }, 1500);
        }
    </script>
</body>
</html>
